# Fly deployment contract for the Django-Theorem control plane.
#
# Required Fly secrets (never commit their values): DATABASE_URL and
# MIGRATE_DATABASE_URL (direct Neon URLs), SECRET_KEY, VALKEY_URL,
# THEOREM_MACHINE_KEY, RUNPOD_API_KEY, RUNPOD_SERVERLESS_ENDPOINT_ID,
# RUNPOD_WORKER_IMAGE_DIGEST, and the ARTIFACT_S3_* credentials. Both database
# URLs must select the imported production-data branch, not the abandoned Neon
# Auth branch.
#
# Store provisioning (apps.tenancy.provisioning) builds each new tenant a
# RustyRed store in the Theorem Fly org. It needs one more secret,
# FLY_API_TOKEN (an org deploy token: `fly tokens create org theorem-620`),
# and two non-secret settings: STORE_IMAGE (an immutable image digest the
# Theorem org can pull) and STORE_SESSION_VERIFYING_KEYS_HEX (the front's
# public session key). Until all three are set, signup leaves tenants unplaced.

app = "travis-django-theorem-personal"
primary_region = "iad"
kill_signal = "SIGTERM"
kill_timeout = "30s"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8000"
  DEBUG = "False"
  ALLOWED_HOSTS = "travis-django-theorem-personal.fly.dev"
  DISABLE_SERVER_SIDE_CURSORS = "True"
  CONN_MAX_AGE = "0"
  THEOREM_API_BASE = "http://travis-theorem-personal.internal:8080"
  # The endpoint and API key stay in Fly secrets. A RunPod job must return the
  # theorem.offload.v1 Arrow descriptor; malformed outputs fail the job.
  OFFLOAD_EXECUTION_MODE = "runpod"

[processes]
  # Applies migrations through MIGRATE_DATABASE_URL, then serves the Django
  # API and operations console at /admin/.
  web = "/app/scripts/railway-boot.sh"
  # Python offload/control-plane jobs.
  worker = "celery -A theorem_control worker -l info -Q celery"
  # Periodic competence refit/recovery pass. It dispatches onto the default
  # worker queue and never fits inside the scheduler process.
  beat = "celery -A theorem_control beat -l info"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["web"]

  [[http_service.checks]]
    interval = "15s"
    timeout = "10s"
    grace_period = "30s"
    method = "GET"
    path = "/healthz"
    protocol = "http"
    headers = { Host = "travis-django-theorem-personal.fly.dev", X-Forwarded-Proto = "https" }

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "512mb"
