# Dedicated Fly app for R data-science work. It uses Dockerfile.r so the web and
# Python worker stay small; deploy it independently after setting the listed
# secrets on this app as well.
#
# Required secrets: DATABASE_URL, SECRET_KEY, VALKEY_URL, THEOREM_MACHINE_KEY,
# ARTIFACT_S3_* credentials, and any enabled WorkOS/Stripe credentials.
# DATABASE_URL must be the direct URL for the imported Neon default branch.
# Django selects the isolated control schema with a startup search_path option,
# which Neon pooler connections intentionally reject.
# R jobs do not require RUNPOD_API_KEY.

app = "travis-django-theorem-r"
primary_region = "iad"
kill_signal = "SIGTERM"
kill_timeout = "30s"

[build]
  dockerfile = "Dockerfile.r"

[env]
  DEBUG = "False"
  DISABLE_SERVER_SIDE_CURSORS = "True"
  CONN_MAX_AGE = "0"
  THEOREM_API_BASE = "http://travis-theorem-personal.internal:8080"
  R_OFFLOAD_EXECUTION_MODE = "rpy2"
  RENV_LOCKFILE_PATH = "/app/renv.lock"

[processes]
  data_science = "/app/scripts/start-r-worker.sh"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "1gb"
